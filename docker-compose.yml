services:
  web:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - api
  # Phase 2 backend. Replace the image with the FastAPI service once built.
  api:
    image: python:3.12-slim
    command: ["python", "-m", "http.server", "8000"]
    environment:
      DATABASE_URL: postgresql://cpi:cpi@db:5432/cpi
    depends_on:
      - db
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: cpi
      POSTGRES_PASSWORD: cpi
      POSTGRES_DB: cpi
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
