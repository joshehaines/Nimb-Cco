services:
  web:
    build:
      context: .
      args:
        VITE_DATA_PROVIDER: http
        VITE_ASSISTANT: ${VITE_ASSISTANT:-}
        VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:-}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-}
        VITE_ADMIN_EMAILS: ${VITE_ADMIN_EMAILS:-}
        VITE_OS_API_KEY: ${VITE_OS_API_KEY:-}
    ports:
      - "8080:80"
    depends_on:
      - api
  api:
    build: ./api
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-claude-sonnet-5-5}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DATABASE_URL: postgresql://cpi:cpi@db:5432/cpi
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
  # One-shot: creates the schema and loads the collected open data from public/data, then exits.
  alerts:
    build: ./api
    command: python -m alerts.worker --loop 300
    environment:
      DATABASE_URL: postgresql://cpi:cpi@db:5432/cpi
      APP_URL: ${APP_URL:-http://localhost:8080/}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-alerts@property-intelligence.internal}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      ALERTS_DRY_RUN: ${ALERTS_DRY_RUN:-1}
    depends_on:
      db:
        condition: service_healthy
  loader:
    build: ./api
    command: >
      sh -c "psql $$DATABASE_URL -v ON_ERROR_STOP=0 -f schema.sql >/dev/null 2>&1;
             python -m ingest.open_data --public /data"
    environment:
      DATABASE_URL: postgresql://cpi:cpi@db:5432/cpi
    volumes:
      - ./public/data:/data:ro
      - ./scripts/data/raw:/raw:ro      # step 1 downloads; load with: docker compose --profile load run --rm loader python -m ingest.run <job> --workdir /raw
    depends_on:
      db:
        condition: service_healthy
    profiles: ["load"]
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: cpi
      POSTGRES_PASSWORD: cpi
      POSTGRES_DB: cpi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cpi -d cpi"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
