# Production overlay: HTTPS in front, nothing but 80/443 exposed, services restart on reboot.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
  web:
    restart: unless-stopped
    ports: !override []            # only reachable through caddy
  api:
    restart: unless-stopped
    ports: !override []
  alerts:
    restart: unless-stopped
  db:
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
